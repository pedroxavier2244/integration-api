services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - .env
    ports:
      - "${API_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - integration_api_net
      - implementation_default
    restart: unless-stopped

networks:
  integration_api_net:
    driver: bridge
  implementation_default:
    external: true
